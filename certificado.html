<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — IX Congreso Nacional de Profesionales en Turismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Great+Vibes&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --gold:#C9971F; --gold-lt:#E8C878; --jungle-dk:#0E2620; --jungle-dker:#081813;
    --serif:"Fraunces",serif; --sans:"Manrope",sans-serif; --script:"Great Vibes",cursive;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{ margin:0; background:radial-gradient(circle at 50% 0%, #0f2620, #071410); color:#EFE2BC;
    font-family:var(--sans); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:22px 12px 40px; gap:16px; }
  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:100px; font-weight:800;
    font-size:.9rem; text-decoration:none; border:2px solid transparent; cursor:pointer; font-family:var(--sans); }
  .btn-gold{ background:var(--gold); color:var(--jungle-dk); }
  .btn-gold:hover{ background:var(--gold-lt); }
  .btn-ghost{ background:transparent; color:#EFE2BC; border-color:rgba(255,255,255,.35); }
  .state{ text-align:center; max-width:520px; line-height:1.6; }
  .state a{ color:var(--gold-lt); }

  .cert-wrap{ width:100%; max-width:1100px; }
  .cert{
    position:relative; width:100%; aspect-ratio:2200 / 1702; background:#fbf6e6;
    box-shadow:0 34px 80px rgba(0,0,0,.6); border-radius:4px; overflow:hidden;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .cert-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  /* Nombre del participante — sobre la línea de "Otorgado a:" */
  .cert-name{
    position:absolute; top:57.5%; height:9.5%; left:16%; right:16%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--script); color:#7C2E1B; line-height:1; z-index:2;
    font-size:clamp(1.5rem, 4.6vw, 3.6rem); white-space:nowrap;
  }
  /* Código de verificación — por defecto, esquina inferior derecha, discreto */
  .cert-code{
    position:absolute; bottom:3.4%; right:4%; top:auto; white-space:nowrap;
    background:rgba(255,253,247,.9); border:1px solid rgba(201,151,31,.5); border-radius:100px;
    padding:2px 12px; font-family:var(--sans); font-size:clamp(.4rem,.85vw,.62rem); color:#3f3320;
    letter-spacing:.02em; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.1);
  }
  .cert-code b{ color:#7C2E1B; }

  @media print{
    @page{ size: letter landscape; margin:0; }
    html,body{ background:#fff !important; padding:0 !important; margin:0 !important; }
    body{ display:block !important; }
    .toolbar,.state{ display:none !important; }
    .cert-wrap{ max-width:none !important; width:100% !important; margin:0 !important; }
    .cert{ width:100% !important; height:auto !important; aspect-ratio:2200 / 1702 !important; border-radius:0 !important; box-shadow:none !important;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .cert-bg{ object-fit:fill !important; }
  }
</style>
</head>
<body>
  <div class="toolbar" id="toolbar" style="display:none;">
    <button class="btn btn-gold" id="cert-download" type="button">Descargar certificado</button>
    <button class="btn btn-ghost" onclick="window.print()">Imprimir / PDF</button>
    <a class="btn btn-ghost" href="/verificar">Verificar otro código</a>
  </div>

  <div class="state" id="state">Cargando certificado…</div>

  <div class="cert-wrap" id="cert-wrap" style="display:none;">
    <div class="cert" id="cert-sheet">
      <img class="cert-bg" id="cert-bg" alt="Certificado de participación" crossorigin="anonymous">
      <div class="cert-name" id="c-name">—</div>
      <div class="cert-code">Código: <b id="c-code">—</b></div>
    </div>
  </div>

<script src="moxena-config.js"></script>
<script>
  (function(){
    var cfg = window.MOXENA_CONFIG || {};
    var stateEl = document.getElementById('state');
    var params = new URLSearchParams(location.search);
    var code = params.get('codigo') || params.get('code') || '';
    var DEFAULT_TEMPLATE = 'certificado-plantilla.jpg';

    function fail(msg){
      stateEl.innerHTML = msg; stateEl.style.display='block';
      document.getElementById('cert-wrap').style.display='none';
      document.getElementById('toolbar').style.display='none';
    }
    function fitName(){
      var el = document.getElementById('c-name');
      el.style.fontSize = '';              // vuelve al tamano base (CSS)
      var tries = 0;
      while(el.scrollWidth > el.clientWidth + 1 && tries < 40){
        var cur = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = (cur * 0.94) + 'px';
        tries++;
      }
    }

    if(!code){ return fail('Falta el código del certificado en el enlace. Usa <a href="/verificar">la página de verificación</a>.'); }
    if(!cfg.supabaseUrl || !cfg.supabasePublishableKey){ return fail('Configuración no disponible. Intenta más tarde.'); }
    var headers = { apikey:cfg.supabasePublishableKey, Authorization:'Bearer '+cfg.supabasePublishableKey };
    var tbl = cfg.settingsTable || 'congreso_site_content';

    // Plantilla del certificado (CMS) — si no hay, usa la de por defecto
    fetch(cfg.supabaseUrl+'/rest/v1/'+tbl+'?section_key=eq.landing&select=content', { headers:headers })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var c = (rows[0] && rows[0].content) || {};
        var tpl = c.img_cert_template || DEFAULT_TEMPLATE;
        document.getElementById('cert-bg').src = tpl;
        // Posicion del nombre configurable (por si se cambia la plantilla)
        var nameEl = document.getElementById('c-name');
        if(c.cert_name_top){ nameEl.style.top = parseFloat(c.cert_name_top) + '%'; }
        if(c.cert_name_color){ nameEl.style.color = c.cert_name_color; }
        var cc = document.querySelector('.cert-code');
        if(c.cert_code_top){ cc.style.top = parseFloat(c.cert_code_top) + '%'; cc.style.bottom = 'auto'; }
        if(c.cert_code_bottom){ cc.style.bottom = parseFloat(c.cert_code_bottom) + '%'; cc.style.top = 'auto'; }
        if(c.cert_code_right){ cc.style.right = parseFloat(c.cert_code_right) + '%'; cc.style.left = 'auto'; }
        if(c.cert_code_left){ cc.style.left = parseFloat(c.cert_code_left) + '%'; cc.style.right = 'auto'; }
        if(c.cert_code_size){ cc.style.fontSize = parseFloat(c.cert_code_size) + '%'; }
      })
      .catch(function(){ document.getElementById('cert-bg').src = DEFAULT_TEMPLATE; });

    // Datos del certificado (verificación pública)
    fetch(cfg.supabaseUrl+'/rest/v1/rpc/verify_congreso_certificate', {
      method:'POST',
      headers: Object.assign({ 'Content-Type':'application/json' }, headers),
      body: JSON.stringify({ p_code: code })
    })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('http '+r.status)); })
    .then(function(rows){
      var c = Array.isArray(rows) ? rows[0] : rows;
      if(!c){ return fail('No encontramos un certificado válido con el código <b>'+code+'</b>.<br>Verifica el código o escribe al organizador.'); }
      document.getElementById('c-name').textContent = c.full_name || '—';
      document.getElementById('c-code').textContent = c.certificate_code || code;
      stateEl.style.display='none';
      document.getElementById('cert-wrap').style.display='block';
      document.getElementById('toolbar').style.display='flex';
      document.title = 'Certificado — ' + (c.full_name || code);
      setTimeout(fitName, 60);
      window.addEventListener('resize', fitName);
    })
    .catch(function(){ fail('No se pudo verificar el certificado en este momento. Intenta nuevamente en unos minutos.'); });

    // Descargar el certificado como PDF (carta horizontal, 1 página) en cualquier dispositivo
    document.getElementById('cert-download').addEventListener('click', async function(){
      const btn = this; const sheet = document.getElementById('cert-sheet');
      if(!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)){ window.print(); return; }
      const orig = btn.textContent; btn.disabled = true; btn.textContent = 'Generando PDF…';
      try{
        const canvas = await html2canvas(sheet, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const nm = (document.getElementById('c-name').textContent || 'certificado').trim().replace(/\s+/g,'-');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'letter' });
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, pw, ph);
        pdf.save('certificado-'+nm+'.pdf');
      }catch(e){ console.error(e); alert('No se pudo generar el PDF. Prueba con "Imprimir / PDF".'); }
      finally{ btn.disabled = false; btn.textContent = orig; }
    });
  })();
</script>
</body>
</html>
